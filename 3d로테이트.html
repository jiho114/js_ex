<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
   *{margin: 0; padding: 0;}
   body{background-color: gray;}
   a{text-decoration: none;}
   
   .slideshow{
    width:1100px;
    height:300px;
    margin: 50px auto 0;
    position: relative;
   }

   .left-btn, .right-btn{
    font-size: 50px;
    color: white;
    position: absolute;
    top:calc(50% - 25px);
    line-height:50px;
   }

   .right-btn{
    right: 0;
   }

   .content{
    width:900px;
    height:180px;
    perspective: 900px;
    position: absolute;
    top:calc(50% - 90px);
    left: calc(50% - 450px);
   }

   .content-carrousel{
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition: all .5s;
   }

   .content-carrousel figure{
    width:150px;
    height:150px;
    border: 1px solid #4d444d;
    box-shadow: 0 0 20px #000;
    position: absolute;
    top:calc(50% - 75px);
    left: calc(50% - 75px);
   }

   .content-carrousel figure:nth-child(1){
    transform:rotateY(0deg) translateZ(400px);
   }

   figure:nth-child(2){
    transform:rotateY(40deg) translateZ(400px);
   }
   figure:nth-child(3){
    transform:rotateY(80deg) translateZ(400px);
   }
   figure:nth-child(4){
    transform:rotateY(120deg) translateZ(400px);
   }
   figure:nth-child(5){
    transform:rotateY(160deg) translateZ(400px);
   }
   figure:nth-child(6){
    transform:rotateY(200deg) translateZ(400px);
   }
   figure:nth-child(7){
    transform:rotateY(240deg) translateZ(400px);
   }
   figure:nth-child(8){
    transform:rotateY(280deg) translateZ(400px);
   }
   figure:nth-child(9){
    transform:rotateY(320deg) translateZ(400px);
   }

   .content-carrousel img{
    transition: .5s;
   }
   .content-carrousel img:hover{
    transition: .5s;
    scale: 1.1;
   }
  </style>
</head>
<body>
  <section class="slideshow">
    <a class="left-btn" href="#">&lt;</a>
    <a class="right-btn" href="#">&gt;</a>
    <div class="content">
      <div class="content-carrousel"><!--이미지 9개-->
        <figure class="shadow"><img src="http://via.placeholder.com/150x150"></figure>
        <figure class="shadow"><img src="http://via.placeholder.com/150x150"></figure>
        <figure class="shadow"><img src="http://via.placeholder.com/150x150"></figure>
        <figure class="shadow"><img src="http://via.placeholder.com/150x150"></figure>
        <figure class="shadow"><img src="http://via.placeholder.com/150x150"></figure>
        <figure class="shadow"><img src="http://via.placeholder.com/150x150"></figure>
        <figure class="shadow"><img src="http://via.placeholder.com/150x150"></figure>
        <figure class="shadow"><img src="http://via.placeholder.com/150x150"></figure>
        <figure class="shadow"><img src="http://via.placeholder.com/150x150"></figure>
      </div>
    </div>
  </section>

  <script>
    
    let count = 0;//회전각도
    updateRotation = ()=>{
      const carrousel = document.querySelector('.content-carrousel')
      carrousel.style.transform = `rotateY(${count}deg)`
    }
    let timer = setInterval(()=>{
      count += 0.1;
      updateRotation();
    },1000/60);
    
    const slideshow = document.querySelector('.slideshow')
    slideshow.addEventListener('mouseenter', ()=>{
      clearInterval(timer);
    })
    slideshow.addEventListener('mouseleave',()=>{
      timer = setInterval(()=>{
        count += 0.1;
        updateRotation();
      },1000/60);
    })
    
    let leftBtn = document.querySelector('.left-btn')
    let rightBtn = document.querySelector('.right-btn')

    rightBtn.addEventListener('click', ()=>{
      count = Math.round(count / 40) * 40 + 40;
      updateRotation();
    })
    leftBtn.addEventListener('click', ()=>{
      count = Math.round(count / 40) * 40 - 40;
      updateRotation();
    })

    
    </script>
</body>

</html>
