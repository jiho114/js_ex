<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
      body{ background-color:#033; }
      div{
          padding:0;
          width:800px;
          height:300px;
          border:1px solid #999;
          overflow:hidden;
          margin:auto;
      }
      /*이미지의 position속성을 설정하여 위치를 이동시킬수 있게 합니다.(left,top등을 사용하여 이동)*/
      img{
          position:relative;
          width:1400px;
          height:840px;
          top:0; left:0;
          transition:all 1s ease-in-out;
      }
    </style>
</head>
<body>
  <div> <img src="img/bg_pan.jpg" alt=""> </div>

  <script>
    const img = document.querySelector('img');
    const imgh = img.height;
    const imgw = img.width;

    const start = () => {
      let posx = Math.ceil(Math.random()*(800-imgw)); //800 - imgw 는 -600
      let posy = Math.ceil(Math.random()*(300-imgh));

      //딜레이타임
      let delay = Math.ceil(Math.random()*(5000+2000));

      img.style.left = posx+"px";
      img.style.top = posy+"px";

      setTimeout(()=>{
        start();
      }, delay)
    }
    start();
  </script>
</body>
</html>
