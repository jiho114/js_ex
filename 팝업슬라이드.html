<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Document</title>
	<style>
		* {
			margin: 0;
			padding: 0;
		}

		img {
			border: none;
			vertical-align: top;
		}

		li {
			list-style: none;
			float: left;
			width: 80px;
		}

		/*img의 크기 72px - 여백(8px)*/

		h1 {
			text-align: center;
		}

		#popup {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.7);
			visibility: hidden;
			opacity: 0;
			transition: all 0.5s;
		}

		#popup.on {
			visibility: visible;
			opacity: 1;
		}

		#banner_wrap {
			position: absolute;
			top: -20%;
			left: 50%;
			transform: translate(-50%, -50%);
			background-color: #fff;
			border-radius: 10px;
			width: 260px;
			padding: 10px 20px;
			margin: 0 auto;
			border: 1px solid #aaa;
			transition: all 0.5s 0.5s;
		}

		#banner_wrap.on {
			top: 50%;

		}
		
		#banner {
			width: 800px;
			border: 1px solid red;
			height: 54px;
		}

		#frame {
			width: 232px;
			height: 54px;
			position: relative;
			margin: 10px auto;
			border: 1px solid blue;
			overflow: hidden;
		}

		#btn {
			position: absolute;
			right: 10px;
			bottom: 10px;
		}
	</style>



</head>

<body>
	<h1>팝업 롤링 슬라이드 배너 만들기</h1>
	<div id="popup">
		<div id="banner_wrap">
			<div id="frame">
				<ul id="banner">
					<li><a href="#"><img src="img/팝업슬라이드/pic_t1.jpg" alt="사진1"></a></li>
					<li><a href="#"><img src="img/팝업슬라이드/pic_t2.jpg" alt="사진2"></a></li>
					<li><a href="#"><img src="img/팝업슬라이드/pic_t3.jpg" alt="사진3"></a></li>
					<li><a href="#"><img src="img/팝업슬라이드/pic_t4.jpg" alt="사진4"></a></li>
					<li><a href="#"><img src="img/팝업슬라이드/pic_t5.jpg" alt="사진5"></a></li>

				</ul>
			</div>
			<p>
				<a href="#" class="prev">
					<img src="img/팝업슬라이드/prev_btn.png" alt="이전 버튼">
				</a>
				<a href="#" class="next">
					<img src="img/팝업슬라이드/next_btn.png" alt="다음 버튼">
				</a>

			</p>
			<button id="btn">close</button>
		</div>
	</div>

	<div id="main">
		<a href="#"><img src="img/팝업슬라이드/pic_1.jpg" alt="사진1"></a>
	</div>
<script>
  let list = document.querySelector('#banner')
  let listLi = document.querySelectorAll('#banner>li')
  let showNum = 3; //보여지는 이미지 갯수
  let total = listLi.length;
  let liWidth = listLi[0].offsetWidth; //요소의 레이아웃 너비를 정수로 반환
  //첫번째 슬라이드 넓이를 변수에 할당
  //보여지는 슬라이드의 갯수만큼 복제

  for(let i = 0; i < showNum; i++){
    const copyobj = listLi[i].cloneNode(true);
    //li안에있는 자손요소까지 복제함 !!!!!!
    list.appendChild(copyobj)
  }

  let num = 0; //슬라이드 이미지의 순번을 담을 변수 (현재 보여지는 이미지)
//넥스트 변수
  document.querySelector('.next').addEventListener('click',(e)=>{
    e.preventDefault();
    if(num === total){//num값이 이미지의 마지막 순번이면
      num = 0; //처음슬라이드 순번 0으로 변경
      list.style.transition = 'none';
      list.style.marginLeft = '0%';
    }
    setTimeout(function(){
      num++;
      list.style.transition = 'margin-left .5s' //애니메이션 효과 적용
      list.style.marginLeft = `${-liWidth*num}px` // 한개의 슬라이드의 넓이 * num만큼 이동
    }, 50) //0.05초뒤에 함수 실행
  })

  //왼쪽 화살표 버튼 클릭시 이전으로 이동
  document.querySelector('.prev').addEventListener('click',(e)=>{
    e.preventDefault();
    if(num === 0){
      num = total;
      list.style.transition = 'none';
      list.style.marginLeft = `${-liWidth*num}px`;
    }
    setTimeout(function(){
      num--;
      list.style.transition = 'margin-left .5s'
      list.style.marginLeft = `${-liWidth*num}px`
    },50)
  })

  //모달창 기능
  const poopup = document.querySelector('#popup');
  const bannerWrap = document.querySelector('#banner_wrap');

  //#main a 요소를 클릭했을때 모달창이 나타나도록 함
document.querySelector('#main a').addEventListener('click',(e)=>{
  e.preventDefault();
  popup.classList.add('on')
  bannerWrap.classList.add('on')
})

//클로즈버튼을 클릭했을때 모달창이 꺼짐
document.querySelector('#btn').addEventListener('click', ()=>{
  popup.classList.remove('on')
  bannerWrap.classList.remove('on')
})
</script>
</body>

</html>
