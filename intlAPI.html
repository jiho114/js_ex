<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API</title>
</head>
<body>
  <script>
    // //숫자를 간결하게 나타내기
    // const views = 1234567;
    // //NumberFormat() 첫번째 인수로 언어선택 (ko , en )
    // const formatter = new Intl.NumberFormat("ko-KR",{
    //   notation:"compact",
    //   compactDisplay:'long'
    //   currency: "KRW"
    // });
    // document.write(formatter.format(views)+ "<br>")

    //상태시간 나타내기
    
    const fomatter2 = new Intl.RelativeTimeFormat('ko',{
      numeric : 'auto' //lo로 설정하면 내일, 모레, 어제, 그저께로 포현됨
    });
    //기준을 day, hour, minute, second, month, quarter 로 설정할 수 있음
    document.write(fomatter2.format(1,'day')+'<br>') //하루뒤
    document.write(fomatter2.format(2,'day')+'<br>') //하루뒤
    document.write(fomatter2.format(3,'day')+'<br>') //하루뒤
    document.write(fomatter2.format(-1,'day')+'<br>') //하루뒤
    document.write(fomatter2.format(-2,'day')+'<br>') //하루뒤
    document.write(fomatter2.format(-3,'day')+'<br>') //하루뒤
    document.write(fomatter2.format(2,'month')+'<br>') //하루뒤
    
    const today = new Date();
    const started = new Date(2024, 10, 1);
    const daysPassed = Math.ceil((started-today))/(1000*60*60*24);
    document.write(fomatter2.format(daysPassed, 'day')+'<br>')

    const date = new Date(2019, 10, 12);
    console.log(date)
    document.write(new Intl.DateTimeFormat('ko').format(date)+'<br>')

    document.write(
      date.toLocaleDateString('ko',{
        minute:'numeric',
        hour:'numeric',
        day:'numeric',
        month:'long',
        year:'numeric',
        weekday:'short'
      })
    )
    
    </script>
</body>
</html>
