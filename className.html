<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      background-color: antiquewhite;
    }
    .red {
      color: red;
    }
    .blue {
      color: blue;
    }
  </style>
</head>

<body>
  <div class="box red">Hello world</div>
  <script>
    const box = document.querySelector('.box');

    console.log(box.className); //class 어트리뷰트 값을 취득

    //box요소의 class 어트리뷰트 값 중에서 red만 blue로 변경
    box.className = box.className.replace("red", "blue");
    
    box.classList.replace('bule', 'red')
    //클래스 추가
    box.classList.add('foo')
    //클래스제거
    box.classList.remove('foo')
    console.log(box.classList)
//인수로 전달한 인덱스에 해당하는 클래스를 반환
console.log(box.classList.item(0))
//인수로 전달한 문자열과 일치하는 클래스가 포함되어있으면 true 없으면 false를 반환
box.classList.contains('box');
box.classList.contains('foo');
//클래스가없으면 추가 클래스가 있으면 제거
box.classList.toggle('foo')

  </script>
</body>

</html>
